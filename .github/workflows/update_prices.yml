# 一般サイトの価格を1日1回、楽天APIから自動で取得してデータベースに保存する
# 接続情報はリポジトリの Settings → Secrets and variables → Actions に登録する
#   SUPABASE_URL / SUPABASE_ANON_KEY / RAKUTEN_APPLICATION_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_REFERER（許可Webサイトを登録した場合だけ）
name: Update prices

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 21:00 UTC（日本時間 6:00）
  workflow_dispatch:        # Actions の画面から手動でも動かせる

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
        run: |
          # 接続情報や楽天のキーが登録されていなければ何もしない（仮の価格は手元で一度入れれば足りるため）
          if [ -z "$SUPABASE_URL" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then echo "接続情報が未登録のため終了"; exit 0; fi
          python -m prices.update
